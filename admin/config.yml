# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
logo:
  src: skoolink.png
  show_in_header: true

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1024
        height: 1024
      svg:
        optimize: true

app_title: Master Data Skoolink

backend:
  name: github
  repo: skoolink/skoolink-master-data
  branch: content
  base_url: https://skoolink-auth.gorraboo.workers.dev/

media_folder: static/media
public_folder: /media

collections:
  - name: schools
    label: Schools
    icon: school
    folder: /schools
    path: "{{slug}}/index"
    identifier_field: code
    summary: "{{code}} {{name}}"
    public_folder: .
    media_folder: .
    format: yaml
    editor:
      preview: false
    fields:
      - label: Name
        name: name
        widget: string
      - label: Code
        name: code
        maxlength: 4
        widget: string
        pattern:
          - '^\d{4}$'
          - "Harus diisi tepat 4 digit angka (contoh: 0001)"
      - label: Domain
        name: domain_name
        widget: string
        pattern:
          - '^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$'
          - "Masukkan nama domain yang valid (contoh: domain.com atau sub.domain.co.id)"
      - label: Logo
        name: logo
        widget: image

  - divider: true

  - name: administrative_area
    label: Administrative Area
    label_singular: Administrative Area
    folder: /wilayah
    identifier_field: data.code
    summary: "{{slug}}/L{{meta.administrative_area_level}} at {{meta.updated_at}}"
    format: json
    editor:
      preview: false
    reorder:
      key: weight
    fields:
      - label: Meta
        name: meta
        widget: object
        fields:
          - label: Level
            name: administrative_area_level
            widget: string
          - label: Urutan
            name: updated_at
            widget: datetime
      - label: Data
        name: data
        widget: list
        summary: "summary {{code}} {{name}}"
        collapsed: true
        fields:
          - label: Code
            name: code
            widget: string
            maxlength: 5
          - label: Name
            name: name
            widget: string

  - name: provinces
    label: Province
    icon: map
    folder: /provinces
    identifier_field: code
    summary: "{{slug}} {{name}}"
    format: yaml
    editor:
      preview: false
    reorder:
      key: weight
    fields:
      - { label: Level, name: administrative_area_level, value: 1, widget: hidden }
      - { label: Urutan, name: updated_at, widget: hidden, default: "{{datetime}}" }
      - label: Code
        name: code
        widget: string
        maxlength: 2
      - label: Name
        name: name
        widget: string
      - name: map
        widget: map
        type: Point
        center: [106.827168,-6.1754049] 
        zoom: 11

  - name: districts
    label: District
    icon: location_city
    folder: /districts
    identifier_field: code
    summary: "{{slug}} {{name}}, {{province.name}}"
    format: json
    view_groups:
      - field: province
        label: Province
    editor:
      preview: false
    reorder:
      key: weight
    fields:
      - { label: Level, name: administrative_area_level, value: 2, widget: hidden }
      - { label: Urutan, name: updated_at, widget: hidden, default: "{{datetime}}" }
      - label: Province
        name: province
        widget: relation
        collection: provinces
        display_fields:
        - slug
        - name
      - label: Code
        name: code
        widget: string
        maxlength: 5
      - label: Name
        name: name
        widget: string

  - divider: true

  - name: team
    label: Team
    icon: group
    identifier_field: name
    path: '{{slug}}/index'
    folder: /data-team
    public_folder: .
    media_folder: .
    description: Informasi tentang team inalix
    editor:
      preview: false
    fields:
      - name: name
        label: Username
        widget: string
        pattern:
          - '^[a-zA-Z][a-zA-Z0-9]{2,11}$'
          - "Username harus 3-12 karakter, diawali huruf, dan hanya boleh berisi huruf dan angka."
      - name: fullname
        widget: string
      - name: birthday
        widget: datetime
      - name: division
        widget: string
      - name: photo
        widget: image
      - name: body
        widget: richtext
