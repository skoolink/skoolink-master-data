# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
logo:
  src: skoolink.png
  show_in_header: true

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1024
        height: 1024
      svg:
        optimize: true

app_title: Master Data Skoolink

backend:
  name: github
  repo: skoolink/skoolink-site
  branch: main
  base_url: https://skoolink-auth.gorraboo.workers.dev/

media_folder: static/img
public_folder: /img


collections:
  - name: blog
    label: Blog
    folder: content/blog
    media_folder: static/img/blog
    public_folder: /img/blog
    slug: '{{slug}}'
    editor:
      preview: false
    fields:
      - label: Judul Artikel
        name: title
        widget: string
      - label: Custom URL Slug
        name: slug
        widget: string
        required: false
        hint: "Kosongkan saja jika ingin URL otomatis mengikuti Judul Artikel"
      - label: Tanggal Publikasi
        name: date
        widget: datetime
      - label: Author
        name: author
        widget: string
      - label: Gambar Artikel
        name: image
        widget: image
      - label: Ringkasan Artikel
        name: summary
        widget: text
      - label: Kategori Utama
        name: categories
        widget: select
        multiple: true
        max: 2
        options:
          - Digitalisasi Sekolah
          - Manajemen & Administrasi
          - Hubungan Orang Tua & Sekolah
          - Berita & Informasi
      - label: Tags
        name: tags
        widget: list
        required: false
      - label: Konten Artikel
        name: body
        widget: richtext
      - label: Warna Background
        name: background_color
        widget: color
        enableAlpha: true
        allowInput: true
        default: '#00000090'
      - label: Warna Teks
        name: color
        widget: color
        enableAplha: false
        allowInput: false
        default: '#ffffff'
        
  - name: promo
    label: Promo
    folder: content/promo
    media_folder: static/img/promo
    public_folder: /img/promo
    editor:
      preview: false
    fields:
      - label: Judul Promo
        name: title
        widget: string
      - label: Tanggal Publikasi
        name: date
        widget: datetime
      - label: Periode / Masa Berlaku
        name: offer_period
        widget: datetime
      - label: Status Promo Berakhir?
        name: expired
        widget: boolean
      - label: Label / Tag Promo
        name: badge
        widget: string 
      - label: Ringkasan Singkat
        name: summary
        widget: text  
      - label: Poster / Flyer Promo
        name: image
        widget: image 
      - label: Ringkasan Paket Penawaran
        name: offer_title
        widget: string
      - label: Judul Seksi Keunggulan
        name: benefits_title
        widget: string 
      - label: Deskripsi Seksi Keunggulan
        name: benefits_subtitle
        widget: string  
      - label: Daftar Poin Keunggulan
        name: benefits
        widget: list
        fields:
          - name: badge
            label: Badge
            widget: string
          - name: description
            label: Deskripsi
            widget: string
          - name: icon
            label: Ikon FontAwesome
            widget: string
          - name: title
            label: Judul Keuntungan
            widget: string
          - name: footer_note
            label: Catatan Kaki
            widget: string
            required: false
            
      - label: Banner Sorotan
        name: quote_box
        widget: object 
        required: false
        fields:
          - name: title
            label: Judul Ajakan / Tagline
            widget: string
            required: false
          - name: subtext
            label: Teks Tambahan Banner
            widget: string
            required: false
      - label: Deskripsi Promo
        name: body
        widget: richtext 
        required: false
            
      - label: Contact Info
        name: contact_info
        widget: object
        required: false
        fields:
          - name: email
            label: Email Khusus Promo
            widget: string
            required: false
          - name: phone
            label: Nomor WhatsApp Khusus
            widget: string
            required: false
          - name: website
            label: Tautan Web Khusus
            widget: string
            required: false
        
        
      
  - name: schools
    label: Schools
    icon: school
    folder: /schools
    path: "{{slug}}/index"
    identifier_field: code
    summary: "{{code}} {{name}}"
    public_folder: .
    media_folder: .
    format: yaml
    editor:
      preview: false
    fields:
      - label: Name
        name: name
        widget: string
      - label: Code
        name: code
        maxlength: 4
        widget: string
        pattern:
          - '^\d{4}$'
          - "Harus diisi tepat 4 digit angka (contoh: 0001)"
      - label: Domain
        name: domain_name
        widget: string
        required: false
        pattern:
          - '^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$'
          - "Masukkan nama domain yang valid (contoh: domain.com atau sub.domain.co.id)"
      - label: Logo
        name: logo
        widget: image
        required: false
      - label: Note
        name: note
        widget: text
        required: false
      - label: Warna
        name: warna
        widget: color
        required: false
      - name: location
        widget: map
        type: Point
        center: [106.827168,-6.1754049] 
        zoom: 12
        required: false

  - divider: true

  - name: administrative_area
    label: Administrative Area
    label_singular: Administrative Area
    folder: /wilayah
    identifier_field: data.code
    summary: "{{slug}}/L{{meta.administrative_area_level}} at {{meta.updated_at}}"
    format: json
    editor:
      preview: false
    reorder:
      key: weight
    fields:
      - label: Meta
        name: meta
        widget: object
        fields:
          - label: Level
            name: administrative_area_level
            widget: string
          - label: Urutan
            name: updated_at
            widget: datetime
      - label: Data
        name: data
        widget: list
        summary: "summary {{code}} {{name}}"
        collapsed: true
        fields:
          - label: Code
            name: code
            widget: string
            maxlength: 5
          - label: Name
            name: name
            widget: string

  - name: provinces
    label: Province
    icon: map
    folder: /provinces
    identifier_field: code
    summary: "{{code}} {{name}}"
    format: yaml
    editor:
      preview: false
    reorder:
      key: weight
    fields:
      - { label: Level, name: administrative_area_level, value: 1, widget: hidden }
      - { label: Urutan, name: updated_at, widget: hidden, default: "{{datetime}}" }
      - label: Code
        name: code
        widget: string
        maxlength: 2
      - label: Name
        name: name
        widget: string
      - name: map
        widget: map
        type: Point
        center: [106.827168,-6.1754049] 
        zoom: 11
        required: false

  - name: districts
    label: District
    icon: location_city
    folder: /districts
    identifier_field: code
    summary: "{{slug}} {{name}}"
    format: json
    view_groups:
      - field: province
        label: Province
    editor:
      preview: false
    reorder:
      key: weight
    fields:
      - { label: Level, name: administrative_area_level, value: 2, widget: hidden }
      - { label: Urutan, name: updated_at, widget: hidden, default: "{{datetime}}" }
      - label: Province
        name: province
        widget: relation
        collection: provinces
        display_fields:
        - code
        - name
      - label: Code
        name: code
        widget: string
        maxlength: 5
      - label: Name
        name: name
        widget: string

  - divider: true

  - name: team
    label: Team
    icon: group
    identifier_field: name
    path: '{{slug}}/index'
    folder: /data-team
    public_folder: .
    media_folder: .
    description: Informasi tentang team inalix
    editor:
      preview: false
    fields:
      - name: name
        label: Username
        widget: string
        pattern:
          - '^[a-zA-Z][a-zA-Z0-9]{2,11}$'
          - "Username harus 3-12 karakter, diawali huruf, dan hanya boleh berisi huruf dan angka."
      - name: fullname
        widget: string
      - name: birthday
        widget: datetime
      - name: division
        widget: string
        required: false
      - name: photo
        widget: image
        required: false
      - name: body
        widget: richtext
        required: false
