name: Build Schools Data (Python)

on:
  push:
    branches:
      - content
    paths:
      - "schools/**"
      - "scripts/build_schools.py"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Build dist/schools.js + logos
        run: python3 scripts/build_schools.py

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: schools
          branch: public
          force: false
